name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node version
        run: node --version && npm --version

      - name: Syntax check
        run: |
          node --check server.js
          for f in lib/*.js; do node --check "$f"; done
          node --check public/app.js

      - name: Run args tests
        run: node --test test/unit/args.test.js
      - name: Run parse tests
        run: node --test test/unit/parse.test.js
      - name: Run store tests
        run: node --test test/unit/store.test.js
      - name: Run scanner tests
        run: node --test test/unit/scanner.test.js
      - name: Run server tests
        run: node --test test/unit/server.test.js
