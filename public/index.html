<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="NMAP·WEB — a local, full-featured nmap web interface.">
  <title>NMAP·WEB — network reconnaissance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2334d399' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%2322d3ee' stroke-width='1.5' opacity='.7'/%3E%3Cpath d='M16 16 23 9' stroke='%2334d399' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%2334d399'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="app">
    <!-- ================= Sidebar ================= -->
    <aside class="sidebar" id="sidebar" aria-label="Scan history and app navigation">
      <div class="sidebar-top">
        <a class="brand" href="#/new" aria-label="NMAP WEB home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="15" stroke="url(#brandGrad)" stroke-width="1.6" opacity=".85"/>
              <circle cx="20" cy="20" r="9" stroke="url(#brandGrad)" stroke-width="1.1" opacity=".55"/>
              <path d="M20 20 32 8" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="20" cy="20" r="2.3" fill="#34d399"/>
              <circle cx="30" cy="13" r="1.3" fill="#22d3ee"/>
              <circle cx="11" cy="26" r="1.6" fill="#34d399" opacity=".7"/>
              <circle cx="28" cy="28" r="1.1" fill="#22d3ee" opacity=".6"/>
              <defs>
                <linearGradient id="brandGrad" x1="5" y1="5" x2="35" y2="35" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-name">NMAP<span class="brand-sep">·</span>WEB</span>
            <span class="brand-tag">network reconnaissance</span>
          </span>
        </a>
        <button class="icon-btn sidebar-close" type="button" data-action="close-sidebar" aria-label="Close sidebar">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <button class="btn btn-primary new-scan" type="button" data-action="new-scan">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New scan</span>
        <kbd>⌘↵</kbd>
      </button>

      <div class="history-block">
        <div class="history-head">
          <span class="section-label">History</span>
          <span class="count-chip" id="historyCount">0</span>
        </div>
        <div class="input-shell history-filter">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.3"/><path d="m15.7 15.7 4.3 4.3"/></svg>
          <input id="historyFilter" type="search" placeholder="Filter history" autocomplete="off" spellcheck="false" aria-label="Filter scan history">
          <kbd>/</kbd>
        </div>
        <div class="history-list" id="historyList" aria-live="polite"></div>
      </div>

      <div class="sidebar-foot">
        <div class="conn-row">
          <span class="conn-dot" aria-hidden="true"></span>
          <span id="connText">Connecting…</span>
        </div>
        <div class="foot-row">
          <span class="nmap-version" id="nmapVersion" title="nmap version">nmap —</span>
          <button class="icon-btn tiny" type="button" data-action="token" title="Set API access token" aria-label="Set API access token">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12 19 4M17 4l3 3M15 6l2 2"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim" data-action="close-sidebar" hidden></div>

    <!-- ================= Main ================= -->
    <main class="main" id="main">
      <div class="mobile-bar">
        <button class="icon-btn" type="button" data-action="toggle-sidebar" aria-label="Open menu">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="mobile-brand">NMAP<span>·</span>WEB</span>
        <span class="mobile-conn"><span class="conn-dot" aria-hidden="true"></span></span>
      </div>

      <div class="banner" id="backendBanner" role="alert" hidden>
        <span class="banner-ico">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 9v5M12 17v.4"/></svg>
        </span>
        <div class="banner-copy">
          <strong>Backend unreachable</strong>
          <span id="bannerText">Could not reach the API. Is the server running?</span>
        </div>
        <button class="btn btn-sm" type="button" data-action="retry">Retry</button>
        <button class="btn btn-sm" type="button" data-action="token" id="bannerToken" hidden>Set token</button>
      </div>

      <div id="viewHost" class="view-host">
        <div class="view">
          <div class="view-inner">
            <div class="loading-block"><span class="spinner"></span><p>Loading NMAP·WEB…</p></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- ================= Token dialog ================= -->
  <dialog class="dialog" id="tokenDialog" aria-labelledby="tokenTitle">
    <form method="dialog" class="dialog-form" id="tokenForm">
      <div class="dialog-head">
        <h2 id="tokenTitle">Access token</h2>
        <button class="icon-btn tiny" type="button" data-action="token-clear" hidden aria-label="Clear saved token"></button>
      </div>
      <p class="dialog-sub">This server was started with <code>NMAP_UI_TOKEN</code>. The token is kept in this browser's <code>localStorage</code> and sent as <code>X-Auth-Token</code>.</p>
      <label class="field">
        <span class="field-label">Token</span>
        <span class="input-shell">
          <input id="tokenInput" class="input mono-input" type="password" autocomplete="off" spellcheck="false" placeholder="Paste access token">
        </span>
      </label>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-action="token-clear">Clear</button>
        <button class="btn btn-primary" type="submit" value="save">Save token</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
